name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        repository: Far-Beyond-Pulsar/Pulsar-Native
        ref: 2a0ded35395b7c1b2308d3e1a5166c93aa7327eb
        submodules: recursive
        path: pulsar
    - uses: actions/checkout@v4
      with:
        path: pulsar/crates/ui/wgpui-component
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          libfontconfig-dev \
          libwayland-dev \
          libx11-xcb-dev \
          libxkbcommon-x11-dev
    - name: Build
      run: cargo build -p ui --verbose
      working-directory: pulsar
    - name: Run tests
      run: cargo test -p ui --verbose
      working-directory: pulsar
