[package]
name = "ui"
version = "0.1.0"
edition = "2021"
description = "WGPUI Component library — rich UI primitives built on GPUI"
homepage = "https://github.com/Far-Beyond-Pulsar/WGPUI-Component"
keywords = ["GPUI", "application", "desktop", "ui"]
license = "Apache-2.0"
publish = true

[lib]
doctest = false

[features]
default = []

# Enable syntax highlighting support for the code editor.
tree-sitter-languages = [
    "dep:tree-sitter-bash",    "dep:tree-sitter-c",         "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-cmake",   "dep:tree-sitter-cpp",       "dep:tree-sitter-css",
    "dep:tree-sitter-diff",    "dep:tree-sitter-elixir",    "dep:tree-sitter-embedded-template",
    "dep:tree-sitter-go",      "dep:tree-sitter-graphql",   "dep:tree-sitter-html",
    "dep:tree-sitter-java",    "dep:tree-sitter-javascript","dep:tree-sitter-jsdoc",
    "dep:tree-sitter-make",    "dep:tree-sitter-md",        "dep:tree-sitter-proto",
    "dep:tree-sitter-python",  "dep:tree-sitter-ruby",      "dep:tree-sitter-rust",
    "dep:tree-sitter-scala",   "dep:tree-sitter-sequel",    "dep:tree-sitter-swift",
    "dep:tree-sitter-toml-ng", "dep:tree-sitter-typescript","dep:tree-sitter-yaml",
    "dep:tree-sitter-zig",
]

inspector = ["gpui-ce/inspector"]

# CPU+GPU flamegraph/profiler capture engine, surfaced as the Inspector
# panel's "Profiler" tab. Forwards to gpui-ce's own `flamegraph` feature,
# which gates `InspectorTab::Profiler` and the capture/replay APIs this
# crate's `profiler` module builds against.
flamegraph = ["gpui-ce/flamegraph", "dep:wgpu", "dep:bytemuck"]

# (no engine feature flags — all engine deps have been removed)

[dependencies]
gpui-ce.workspace = true
ui-macros = { path = "../ui-macros" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lazy_static = "1"
linkme = "0.3"
lsp-types = "0.97"
notify = "6"
once_cell = "1"
open = "5"
parking_lot = "0.12"
proc-macro2 = "1"
quote = "1"
regex = "1"
resvg = "0.47"
ropey = { version = "=2.0.0-beta.1", features = ["metric_utf16", "metric_lines_lf"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
rust-i18n = "4"
schemars = "1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# Only needed to name `wgpu::Device`/`wgpu::Queue` when calling gpui-ce's
# `Window::gpu_device_and_queue` / `flamegraph_replay::render_deep_capture_step`
# (Profiler tab's GPU deep-capture preview, feature = "flamegraph"). Version
# pinned to match gpui-ce's own `wgpu` dependency so the types are identical;
# Cargo's feature unification means this crate doesn't need to repeat
# gpui-ce's backend feature list.
wgpu = { version = "30", default-features = false, optional = true }
# Only needed to build the flame chart's per-instance GPU bar buffer
# (`profiler.rs`'s `BarInstance`, feature = "flamegraph"). Matches gpui-ce's
# own `bytemuck` version so there is one copy in the dependency graph.
bytemuck = { version = "1.24", features = ["derive"], optional = true }

aho-corasick   = "1.1"
enum-iterator  = "2.3"
gpui_sum_tree  = "0.2.2"
html5ever      = "0.39"
itertools      = "0.14"
markdown       = "1.0"
markup5ever_rcdom = "0.39"
mathjax-svg-rs = "0.4"
mermaid-rs-renderer = { version = "0.2.2", default-features = false }
num-traits     = "0.2"
paste          = "1"
rust_decimal   = { version = "1.37", optional = true }
tree-sitter    = "0.26"
tree-sitter-json = "0.24.8"
unicode-segmentation = "1.12"

# Tree-sitter language grammars (all optional, enabled by tree-sitter-languages feature)
tree-sitter-bash               = { version = "0.25",  optional = true }
tree-sitter-c                  = { version = "0.24",  optional = true }
tree-sitter-c-sharp            = { version = "0.23",  optional = true }
tree-sitter-cmake              = { version = "0.7",   optional = true }
tree-sitter-cpp                = { version = "0.23",  optional = true }
tree-sitter-css                = { version = "0.25",  optional = true }
tree-sitter-diff               = { version = "0.1",   optional = true }
tree-sitter-elixir             = { version = "0.3",   optional = true }
tree-sitter-embedded-template  = { version = "0.25",  optional = true }
tree-sitter-go                 = { version = "0.25",  optional = true }
tree-sitter-graphql            = { version = "0.1",   optional = true }
tree-sitter-html               = { version = "0.23",  optional = true }
tree-sitter-java               = { version = "0.23",  optional = true }
tree-sitter-javascript         = { version = "0.25",  optional = true }
tree-sitter-jsdoc              = { version = "0.25",  optional = true }
tree-sitter-make               = { version = "1.1",   optional = true }
tree-sitter-md                 = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", tag = "v0.5.3", optional = true }
tree-sitter-proto              = { version = "0.4",   optional = true }
tree-sitter-python             = { version = "0.25",  optional = true }
tree-sitter-ruby               = { version = "0.23",  optional = true }
tree-sitter-rust               = { version = "0.24",  optional = true }
tree-sitter-scala              = { version = "0.26",  optional = true }
tree-sitter-sequel             = { version = "0.3",   optional = true }
tree-sitter-swift              = { version = "0.7",   optional = true }
tree-sitter-toml-ng            = { version = "0.7",   optional = true }
tree-sitter-typescript         = { version = "0.23",  optional = true }
tree-sitter-yaml               = { version = "0.7",   optional = true }
tree-sitter-zig                = { version = "1.1",   optional = true }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",       "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
] }

[[example]]
name = "button_custom_hover_active"
path = "../../examples/button_custom_hover_active.rs"

[dev-dependencies]
indoc = "=2.0.7"
# Enables `gpui::TestAppContext`/`#[gpui::test]` for headless render-path
# performance tests (see `profiler.rs`'s flame-chart benchmark). Only pulled
# in for test binaries, thanks to the workspace's resolver = "2" per-target
# feature unification -- normal library/binary builds are unaffected.
gpui-ce = { workspace = true, features = ["test-support"] }


